<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Torneo Algorítmico | Piedra, Papel o Tijera</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f2f5fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
      }

      main {
        width: min(100%, 560px);
        padding: 32px;
        border: 1px solid #e1e7f0;
        border-radius: 24px;
        background: white;
        box-shadow: 0 18px 50px #25365a18;
        text-align: center;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(1.7rem, 5vw, 2.3rem);
      }

      .subtitle {
        margin: 0;
        color: #63708a;
      }

      .scoreboard {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 16px;
        margin: 28px 0;
        padding: 20px;
        border-radius: 16px;
        background: #f5f7fc;
      }

      .score {
        display: grid;
        gap: 4px;
      }

      .score strong {
        font-size: 2.5rem;
        line-height: 1;
      }

      .versus {
        color: #8a94a8;
        font-weight: 700;
      }

      .choices {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }

      button {
        min-width: 120px;
        padding: 12px 16px;
        border: 0;
        border-radius: 12px;
        background: #4258d0;
        color: white;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
        transition: background 150ms ease, transform 150ms ease;
      }

      button:hover:not(:disabled) {
        transform: translateY(-2px);
        background: #3045b8;
      }

      button:focus-visible {
        outline: 3px solid #9aa8ff;
        outline-offset: 3px;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      #result {
        min-height: 3.5em;
        margin: 24px 0 0;
        color: #44516a;
        line-height: 1.6;
      }

      #reset {
        margin-top: 12px;
        background: #e9edf7;
        color: #25314b;
      }

      #reset:hover {
        background: #dce3f2;
      }

      @media (max-width: 420px) {
        main {
          padding: 24px 18px;
        }

        button {
          min-width: 100px;
          flex: 1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>🏆 Torneo Algorítmico</h1>
      <p class="subtitle">Piedra, Papel o Tijera · Mejor de 3</p>

      <section class="scoreboard" aria-label="Marcador">
        <div class="score">
          <span>Tú</span>
          <strong id="user-score" aria-live="polite">0</strong>
        </div>
        <span class="versus">VS</span>
        <div class="score">
          <span>Máquina</span>
          <strong id="machine-score" aria-live="polite">0</strong>
        </div>
      </section>

      <p>Elige tu jugada:</p>
      <div class="choices" aria-label="Opciones de jugada">
        <button type="button" data-choice="piedra">✊ Piedra</button>
        <button type="button" data-choice="papel">✋ Papel</button>
        <button type="button" data-choice="tijera">✌️ Tijera</button>
      </div>

      <p id="result" role="status" aria-live="polite">¡La primera persona en ganar 2 rondas se lleva el torneo!</p>
      <button id="reset" type="button">Reiniciar torneo</button>
    </main>

    <script>
      let victoriasUsuario = 0;
      let victoriasMaquina = 0;
      const victoriasParaGanar = 2;
      const opciones = ["piedra", "papel", "tijera"];
      const nombres = {
        piedra: "Piedra",
        papel: "Papel",
        tijera: "Tijera",
      };

      const botonesJugada = document.querySelectorAll("[data-choice]");
      const marcadorUsuario = document.querySelector("#user-score");
      const marcadorMaquina = document.querySelector("#machine-score");
      const resultado = document.querySelector("#result");

      function jugar(entrada) {
        const jugada = entrada.trim().toLowerCase();
        const jugadaMaquina = opciones[Math.floor(Math.random() * opciones.length)];

        let mensaje = `Tú: ${nombres[jugada]}. Máquina: ${nombres[jugadaMaquina]}. `;

        if (jugada === jugadaMaquina) {
          mensaje += "Empate: nadie suma un punto.";
        } else if (
          (jugada === "piedra" && jugadaMaquina === "tijera") ||
          (jugada === "papel" && jugadaMaquina === "piedra") ||
          (jugada === "tijera" && jugadaMaquina === "papel")
        ) {
          victoriasUsuario++;
          mensaje += "¡Ganaste esta ronda!";
        } else {
          victoriasMaquina++;
          mensaje += "La máquina ganó esta ronda.";
        }

        marcadorUsuario.textContent = victoriasUsuario;
        marcadorMaquina.textContent = victoriasMaquina;

        const torneoTerminado =
          victoriasUsuario >= victoriasParaGanar ||
          victoriasMaquina >= victoriasParaGanar;

        if (torneoTerminado) {
          const campeon =
            victoriasUsuario === victoriasMaquina
              ? "Partida sin ganador."
              : victoriasUsuario > victoriasMaquina
                ? "¡Ganaste el torneo!"
                : "La máquina ganó el torneo.";
          mensaje += ` ${campeon}`;
          botonesJugada.forEach((boton) => {
            boton.disabled = true;
          });
        }

        resultado.textContent = mensaje;
      }

      botonesJugada.forEach((boton) => {
        boton.addEventListener("click", () => jugar(boton.dataset.choice));
      });

      document.querySelector("#reset").addEventListener("click", () => {
        victoriasUsuario = 0;
        victoriasMaquina = 0;
        marcadorUsuario.textContent = "0";
        marcadorMaquina.textContent = "0";
        resultado.textContent = "¡La primera persona en ganar 2 rondas se lleva el torneo!";
        botonesJugada.forEach((boton) => {
          boton.disabled = false;
        });
      });
    </script>
  </body>
</html>
